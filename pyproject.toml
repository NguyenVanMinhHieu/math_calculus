[project]
name = "math-calculus"
version = "1.0.0"
description = "Hệ thống hỗ trợ Nghiên cứu và Giảng dạy Giải tích THPT: Diện tích & Thể tích tròn xoay"
authors = [
    { name = "Nguyễn Văn Minh Hiếu", email = "minhhieu@thpt-trungphu.edu.vn" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "sympy",
    "matplotlib",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
